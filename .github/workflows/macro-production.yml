name: Macro production
# Weekdays after the 8:30 ET releases: fetch FRED and the S&P 500, compute RSI v2.0, replay history,
# evaluate, build and validate the UIP package, publish it as macro-production-<run>, keep the history in state/.
on:
  schedule:
    - cron: "40 13 * * 1-5"
  workflow_dispatch:
  pull_request:
    paths: ["config/**", "macro/**", "publication/**", "run.py", ".github/workflows/macro-production.yml"]
permissions:
  contents: write
concurrency:
  group: macro-production
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt && python -m pytest -q
      - name: Fetch, compute, evaluate and package
        run: python run.py --fetch --snapshot data/snapshot --package uip-package --notice | tee run.log
      - name: Report the components (one step each, GitHub keeps ten notices per step)
        run: |
          python - <<'PY'
          import json
          c = json.load(open("outputs/rsi_current.json"))
          for x in c["components"]:
              print(f"::notice title={x['system']} / {x['component']}::{x['value']} {x['unit']} -> {x['score']} (adds {x['contribution']}; {x['series']} {x['observation_month']} {x['status']})")
          PY
      - name: Report the history and the legacy readings
        run: |
          python - <<'PY'
          import json
          d = json.load(open("outputs/rsi_evaluation.json")); e = d["evaluation"]
          print(f"::notice title=Bands::{json.dumps(e['share_of_months_by_band'])} | mean in recessions {e['mean_rsi_in_recession_months']}, outside {e['mean_rsi_outside_recessions']}")
          print(f"::notice title=Episodes at 0.2+::{json.dumps(e['episodes_at_or_above_0_2'])[:900]}")
          print("::notice title=Legacy vs v2.0::" + "; ".join(f"{x['as_of']} {x['rsi_reported']} vs {x['v2_recomputed_for_that_month']}" for x in d["legacy"]))
          c = json.load(open("outputs/rsi_current.json"))
          print(f"::notice title=Overlay::{json.dumps(c['overlays'])}")
          PY
      - name: Report the recession model
        run: |
          python - <<'PY'
          import json, os
          if not os.path.exists("outputs/recession_probability.json"):
              print("::warning title=Recession model::not run (long-history series missing)"); raise SystemExit(0)
          d = json.load(open("outputs/recession_probability.json"))
          print(f"::notice title=Recession model::{d['status']} {d.get('chosen_model')} p12={d.get('probability_12m')} as of {d.get('as_of_month')} | {d['why']}")
          for name, s in d["calibration"].items():
              print(f"::notice title={name}::months {s['months']} ({s['first']}..{s['last']}), events {s['events_in_sample']}, Brier {s['brier']} vs base {s['brier_base_rate']}, skill {s['brier_skill']}, AUC {s['auc']}, log loss {s['log_loss']}, false-alarm months {s['false_alarm_months_at_or_above_30']}")
          for name in ("YIELD_CURVE", "MULTI_FACTOR"):
              s = d["calibration"].get(name)
              if s:
                  print(f"::notice title={name} events::" + "; ".join(f"{e['recession_start']} max {e['max_in_12_before']} lead {e['lead_months']}" for e in s["recessions"]))
                  print(f"::notice title={name} reliability::" + "; ".join(f"{r['band']} n={r['months']} pred {r['mean_predicted']} obs {r['observed']}" for r in s["reliability"]))
          print(f"::notice title=Inputs now::{json.dumps(d.get('inputs'))}")
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: macro-production-${{ github.run_id }}
          path: uip-package/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-run-outputs-${{ github.run_id }}
          path: |
            outputs/
            data/snapshot/MANIFEST.json
            run.log
          retention-days: 14
      - name: Keep the data snapshot on the pull-request branch (so the change can be developed on the same inputs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin "${GITHUB_HEAD_REF}" && git checkout -q -B pr-snapshot "origin/${GITHUB_HEAD_REF}"
          git add data/snapshot
          git diff --cached --quiet || { git commit -q -m "Data snapshot $(date -u +%F) for this pull request"; git push -q origin "HEAD:${GITHUB_HEAD_REF}"; }
      - name: Keep the history and the data snapshot
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p state && cp outputs/rsi_history.csv outputs/rsi_current.json outputs/rsi_evaluation.json state/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state data/snapshot
          git diff --cached --quiet || git commit -m "Macro production $(date -u +%F)"
          git pull --rebase origin main && git push
